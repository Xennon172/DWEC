<body>

    <header>
        <h4>navegación</h4>
        <div>
            <nav>
                <ul>
                    <li><a href="index.html">Portada</a></li>
                    <li><a href="registro.html">Registro</a></li>
                    <li><a href="usuarios.html">Usuarios</a></li>
                    <li><a href="opinion.html">Opinión</a></li>
                    <li><a href="sobreMi.html">Sobre Mí</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1>Registro</h1>
        <form>
            <fieldset>
                <legend>Información Personal</legend>
                <div>
                    <label for="nombre"> Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Evaristo">
                </div>

                <div>
                    <label for="apellido1"> Primer apellido:</label>
                    <input type="text" id="apellido1" name="apellido1" placeholder="Mateo">
                </div>

                <div>
                    <label for="apellido2"> Segundo apellido:</label>
                    <input type="text" id="apellido2" name="apellido2" placeholder="Poveda">
                </div>

                <div>
                    <label for="contrasena1"> Contraseña:</label>
                    <input type="password" id="contrasena1" name="contrasena1" placeholder="********">
                </div>

                <div>
                    <label for="contrasena2"> Repite contraseña:</label>
                    <input type="password" id="contrasena2" name="contrasena2" placeholder="********">
                </div>

                <div>
                    <label for="telefono"> Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="660065942">
                </div>

                <div>
                    <label for="correo"> Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="evaristo@gmail.com">
                </div>

                <div>
                    <p>Género:</p>
                    <input type="radio" name="genero" id="hombre" value="hombre">
                    <label for="hombre">Hombre</label>

                    <input type="radio" name="genero" id="mujer" value="mujer">
                    <label for="mujer">Mujer</label>
                </div>

            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </main>

        <p>&copy; 2025 Práctica 1 HTML. Todos los derechos reservados.</p>
        <ul>
            <li><a href="private.html">Política de privacidad</a></li>
        </ul>
    </footer>

</body>

</html>
